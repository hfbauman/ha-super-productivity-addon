version: '3.8'

services:
  super-productivity:
    image: ghcr.io/linuxserver/super-productivity
    container_name: super-productivity
    restart: unless-stopped
    ports:
      - "3000:3000"  # Required for Ingress
    volumes:
      - ./config:/config
      - ./data:/data
    environment:
      - TZ=UTC

  webdav:
    image: bytemark/webdav
    container_name: webdav
    restart: unless-stopped
    ports:
      - "8080:80"  # Exposing WebDAV for sync
    environment:
      - AUTH_TYPE=Basic
      - USERNAME=admin
      - PASSWORD=password
    volumes:
      - ./data:/var/lib/dav
